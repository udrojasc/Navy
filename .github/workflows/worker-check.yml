name: Validate Navy Worker

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "test/**"
      - ".github/workflows/worker-check.yml"
  pull_request:
    paths:
      - "worker/**"
      - "test/**"
      - ".github/workflows/worker-check.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Worker dependencies
        working-directory: worker
        run: npm install
      - name: Check JavaScript syntax
        working-directory: worker
        run: node --check src/index.js
      - name: Check Test Lab JavaScript syntax
        run: node --check test/app.js
      - name: Validate Wrangler build
        working-directory: worker
        run: npx wrangler deploy --dry-run
