<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>Destino relativo alcanzado</title></head>
<body>
  <h1>Destino relativo alcanzado</h1>
  <script>
    const params = new URLSearchParams(location.search);
    parent.postMessage({
      type: "navy-relative-destination",
      token: params.get("token"),
      passed: params.get("from") === "relative-test" && Boolean(params.get("token")),
      finalUrl: location.href
    }, "*");
  </script>
</body>
</html>
