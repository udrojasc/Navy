<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Navy — CSS @import anidado</title>
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <div id="import-probe" class="navy-import-probe">CSS import</div>
  <script>
    const probe = document.getElementById("import-probe");
    const token = new URLSearchParams(location.search).get("token");
    const expected = [
      "styles/nested/level-one.css",
      "styles/shared/level-two.css",
      "styles/shared/level-three.css"
    ];
    const inspectImports = async () => {
      const checked = [];
      for (const path of expected) {
        const url = new URL(path, location.href);
        const response = await fetch(url.href);
        const css = await response.text();
        const importMatch = css.match(/@import\s+(?:url\()?["']?([^"'\s)]+)["']?\)?/i);
        checked.push({
          path,
          status: response.status,
          url: response.url,
          proxied: response.url.includes("/p/"),
          importUrl: importMatch ? importMatch[1] : "",
          importRewritten: !importMatch || importMatch[1].includes("/p/")
        });
      }
      const styles = getComputedStyle(probe);
      const values = {
        levelOne: styles.getPropertyValue("--navy-import-level-one").trim(),
        levelTwo: styles.getPropertyValue("--navy-import-level-two").trim(),
        levelThree: styles.getPropertyValue("--navy-import-level-three").trim()
      };
      parent.postMessage({
        type: "navy-css-import-result",
        token,
        checked,
        values,
        loaded: Object.values(values).every(value => value === "loaded")
      }, "*");
    };
    const report = () => inspectImports().catch(error => parent.postMessage({
      type: "navy-css-import-result",
      token,
      error: error.message,
      checked: [],
      values: {},
      loaded: false
    }, "*"));
    if (document.readyState === "complete") report();
    else window.addEventListener("load", report, { once: true });
  </script>
</body>
</html>
