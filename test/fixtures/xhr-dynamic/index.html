<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Navy — XMLHttpRequest dinámico</title>
</head>
<body>
  <p>Prueba XMLHttpRequest dinámico</p>
  <script>
    const token = new URLSearchParams(location.search).get("token");
    const nonce = crypto.randomUUID();
    const xhr = new XMLHttpRequest();
    xhr.open("GET", "dynamic-data.json?request=" + encodeURIComponent(nonce), true);
    xhr.responseType = "json";
    xhr.setRequestHeader("Accept", "application/json");
    xhr.onload = () => parent.postMessage({
      type: "navy-xhr-dynamic-result",
      token,
      status: xhr.status,
      contentType: xhr.getResponseHeader("content-type") || "",
      responseUrl: xhr.responseURL,
      nonce,
      data: xhr.response
    }, "*");
    xhr.onerror = () => parent.postMessage({
      type: "navy-xhr-dynamic-result",
      token,
      error: "Error de red en XMLHttpRequest"
    }, "*");
    xhr.send();
  </script>
</body>
</html>
