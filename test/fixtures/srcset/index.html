<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Navy — imágenes responsivas</title>
</head>
<body>
  <img id="responsive-image"
    src="responsive-small.svg"
    srcset="responsive-small.svg 1x, responsive-large.svg 2x"
    sizes="160px"
    width="160"
    height="100"
    alt="Prueba de imagen responsiva">
  <script>
    const image = document.getElementById("responsive-image");
    const token = new URLSearchParams(location.search).get("token");
    const report = () => parent.postMessage({
      type: "navy-srcset-result",
      token,
      loaded: image.naturalWidth > 0,
      naturalWidth: image.naturalWidth,
      currentSrc: image.currentSrc,
      srcset: image.getAttribute("srcset"),
      candidates: image.getAttribute("srcset").split(",").length
    }, "*");
    image.addEventListener("load", report, {once:true});
    image.addEventListener("error", () => parent.postMessage({
      type:"navy-srcset-result", token, loaded:false,
      currentSrc:image.currentSrc, srcset:image.getAttribute("srcset")
    }, "*"), {once:true});
    if (image.complete) report();
  </script>
</body>
</html>
