<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>Navy — sendBeacon</title></head>
<body>
  <p>Prueba sendBeacon</p>
  <script>
    const token = new URLSearchParams(location.search).get("token");
    const parts = location.pathname.split("/");
    const sessionId = parts[2];
    const worker = "https://navy.ulisesdrojasc2.workers.dev";
    const beaconUrl = worker + "/p/" + sessionId + "/https/" +
      encodeURIComponent("navy.ulisesdrojasc2.workers.dev") + "/__navy_test/echo";
    const payload = new URLSearchParams({
      id: "NAVY_SEND_BEACON_14",
      message: "Envío sendBeacon de prueba"
    });
    let accepted = false;
    let error = "";
    try {
      accepted = navigator.sendBeacon(beaconUrl, payload);
    } catch (exception) {
      error = exception.message;
    }
    setTimeout(() => {
      const entries = performance.getEntriesByType("resource");
      const entry = entries.find(item => item.name.includes("/__navy_test/echo") &&
        item.name.includes("/p/" + sessionId + "/"));
      parent.postMessage({
        type: "navy-send-beacon-result",
        token,
        supported: typeof navigator.sendBeacon === "function",
        accepted,
        beaconUrl,
        resourceUrl: entry ? entry.name : "",
        initiatorType: entry ? entry.initiatorType : "",
        error
      }, "*");
    }, 1200);
  </script>
</body>
</html>
